<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge — HYROX Build</title>
<meta name="forge-version" content="2.2">
<meta name="theme-color" content="#111111">
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#121212;--muted:#6c6c68;--line:#deddd7;--soft:#ecebe5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:18px 16px 105px}.top,.row,.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.pill,.chip{background:#e7e5de;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}
h1{font-size:34px;line-height:1.02;margin:7px 0 5px;letter-spacing:-1.2px}h2{margin:5px 0}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.09em;color:var(--muted)}
.sub,.small{color:var(--muted)}.sub{font-size:14px}.small{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.btn{border:0;background:#111;color:#fff;border-radius:13px;padding:13px 15px;font-size:14px;font-weight:850;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.fit{width:auto}.btn.full{width:100%}
.weeknav button{width:44px;height:44px;border:0;border-radius:13px;background:var(--soft);font-size:22px}.weeklabel{text-align:center;flex:1}.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.day{border:0;background:var(--soft);border-radius:12px;padding:9px 2px;min-height:58px;font-size:10px;color:var(--ink)}.day b{display:block;font-size:12px;margin:3px 0}.day.selected{background:#111;color:#fff}.day.today{outline:2px solid #111;outline-offset:1px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{background:var(--soft);border-radius:12px;padding:10px}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:var(--muted)}
.exercise{border-top:1px solid var(--line);padding:15px 0}.exercise:first-child{border-top:0}.exercise h3{margin:0 0 4px;font-size:16px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 38px;gap:6px;align-items:center;margin-top:8px}.setrow input{min-width:0;width:100%;padding:9px 5px;border:1px solid var(--line);border-radius:9px;background:#fafafa;font-size:14px}
.check{height:36px;border:1px solid var(--line);border-radius:9px;background:#fff}.check.done{background:#111;color:#fff}.runfields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.runfields input,.runfields textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.runfields textarea{grid-column:1/-1}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(245,244,239,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}.tabs>div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;padding:9px 2px;font-weight:800;color:#777}.tab.active{color:#111}.hidden{display:none!important}.history{border-top:1px solid var(--line);padding:12px 0}.history:first-child{border-top:0}.notice{border-left:4px solid #111}
.progressline{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}.progressline i{display:block;height:100%;background:#111;width:0}
.timer{position:sticky;top:8px;z-index:10;background:#111;color:#fff;border-radius:14px;padding:10px 12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.timer button{border:0;background:#fff;color:#111;border-radius:9px;padding:7px 9px;font-weight:800}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.mini{border:0;background:var(--soft);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}
.suggest{font-size:12px;font-weight:750;margin-top:5px}.complete{font-size:12px;color:var(--muted);margin-top:7px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin:6px 0;font-weight:750}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand">FORGE</div><div class="pill" id="phase"></div></div>

<section id="today">
<div class="eyebrow">TRAINING CALENDAR</div><h1 id="screenTitle">Today</h1>
<div class="card">
  <div class="weeknav"><button onclick="shiftWeek(-1)">‹</button><div class="weeklabel"><b id="weekLabel"></b><div class="small" id="waveLabel"></div></div><button onclick="shiftWeek(1)">›</button></div>
  <div class="weekgrid" id="weekGrid"></div>
  <button class="btn secondary full" style="margin-top:10px" onclick="goToday()">BACK TO TODAY</button>
</div>
<div id="selectedCard"></div>
</section>

<section id="program" class="hidden"><div class="eyebrow">PROGRAM</div><h1>Pre-HYROX Build</h1><div class="sub">Browse any week and open any training day.</div><div class="card" id="programList"></div></section>
<section id="progress" class="hidden"><div class="eyebrow">PROGRESS</div><h1>Your build</h1><div class="card"><b>Logged volume</b><h2 id="volume">0 lb</h2><div class="small" id="sessions">0 sessions</div></div><div class="card"><b>Running</b><h2 id="mileage">0 mi</h2><div class="small">Logged distance on this device</div></div></section>
<section id="history" class="hidden"><div class="eyebrow">HISTORY</div><h1>Training log</h1><div class="card" id="historyList"></div></section>

<section id="workout" class="hidden">
<div class="row"><div><div class="eyebrow" id="workoutDate"></div><h1 id="workoutName"></h1></div><button class="btn secondary fit" onclick="closeWorkout()">×</button></div>
<div id="restTimer" class="timer hidden"><b>REST <span id="timerValue">1:30</span></b><div><button onclick="addTimer(30)">+30</button> <button onclick="stopTimer()">SKIP</button></div></div><div class="card" id="exerciseList"></div>
<button class="btn full" onclick="saveWorkout()">SAVE WORKOUT</button>
</section>
</main>
<div id="subModal" class="modal hidden" onclick="if(event.target===this)closeSubs()"><div class="sheet"><div class="row"><div><div class="eyebrow">TOUR MODE</div><h2 id="subTitle">Substitute exercise</h2></div><button class="btn secondary fit" onclick="closeSubs()">×</button></div><div id="subChoices"></div></div></div>

<nav class="tabs" id="tabs"><div><button class="tab active" onclick="showTab('today',this)">Today</button><button class="tab" onclick="showTab('program',this)">Program</button><button class="tab" onclick="showTab('progress',this)">Progress</button><button class="tab" onclick="showTab('history',this)">History</button></div></nav>

<script>
const START = new Date(2026,8,21), HYROX = new Date(2026,11,21);
const plan={
1:{name:'Push',sub:'Strength + hypertrophy',run:null,ex:[['Barbell Bench Press',4],['Incline DB Press',3],['Seated DB Shoulder Press',3],['Cable / Machine Fly',3],['Lateral Raise',4],['Triceps Pressdown',3],['Overhead Triceps Extension',2]]},
2:{name:'Easy Run + Pull',sub:'Easy aerobic + back/biceps',run:'3–3.5 mi easy',ex:[['Pull-up / Lat Pulldown',4],['Chest-Supported Row',4],['Single-Arm Cable Row',3],['Rear-Delt Fly',3],['Incline DB Curl',3],['Hammer Curl',3],['Abs',3]]},
3:{name:'Legs',sub:'Lower-body strength + hypertrophy',run:null,ex:[['Back Squat',4],['Romanian Deadlift',3],['Bulgarian Split Squat',3],['Leg Curl',3],['Leg Extension',3],['Standing Calf Raise',4],['Tibialis Raise',3]]},
4:{name:'Tempo + Shoulders/Arms',sub:'Quality run + upper accessories',run:'Tempo: warm-up + controlled work + cooldown',ex:[['Seated DB Shoulder Press',3],['Cable Lateral Raise',4],['Rear-Delt Fly',3],['EZ-Bar Curl',3],['Cable Curl',2],['Cable / Skullcrusher Extension',3],['Rope Pressdown',2]]},
5:{name:'Upper Hypertrophy',sub:'Chest + back + shoulders',run:null,ex:[['Incline Bench Press',3],['Pull-up / Lat Pulldown',3],['Flat DB Press',3],['Seated Cable Row',3],['Pec Deck',2],['Straight-Arm Pulldown',2],['Lateral Raise',3],['Biceps',2],['Triceps',2]]},
6:{name:'Long Easy Run',sub:'Aerobic development',run:'4–5 mi easy',ex:[]},
0:{name:'Rest',sub:'Recovery',run:null,ex:[]}
};
let today=strip(new Date()), selected=new Date(today), weekOffset=0, activeDate=null;
function strip(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monday(d){let x=strip(d),n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));return x}
function weekOf(d){return Math.max(1,Math.floor((monday(d)-monday(START))/604800000)+1)}
function wave(d){return ((weekOf(d)-1)%4)+1}
function repRange(d){return ['','10–12','8–10','6–8','8–10'][wave(d)]}
function rir(d){return wave(d)===4?'3–4':'1–3'}
function setsFor(n,d){return wave(d)===4?Math.max(2,Math.ceil(n*.55)):n}
function fmt(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function history(){try{return JSON.parse(localStorage.forgeHistory||'[]')}catch(e){return[]}}
function previous(ex,date){let h=history().filter(x=>x.date<iso(date));for(let w of h){let found=(w.sets||[]).filter(s=>s.exercise===ex&&s.weight&&s.reps);if(found.length){let best=found.sort((a,b)=>(b.weight*b.reps)-(a.weight*a.reps))[0];return best.weight+' lb × '+best.reps}}return 'No previous log'}
function renderCalendar(){
 let base=monday(today);base.setDate(base.getDate()+weekOffset*7);
 document.getElementById('weekLabel').textContent=base.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+new Date(base.getFullYear(),base.getMonth(),base.getDate()+6).toLocaleDateString('en-US',{month:'short',day:'numeric'});
 document.getElementById('waveLabel').textContent='Week '+weekOf(base)+' · '+(wave(base)===4?'DELOAD':'BUILD '+wave(base))+' · '+repRange(base)+' reps';
 let out=''; for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()+i);let p=plan[d.getDay()];let cls=iso(d)===iso(selected)?' selected':'';if(iso(d)===iso(today))cls+=' today';out+=`<button class="day${cls}" onclick="selectDate('${iso(d)}')"><span>${d.toLocaleDateString('en-US',{weekday:'short'})}</span><b>${d.getDate()}</b><span>${p.name.split(' ')[0]}</span></button>`} document.getElementById('weekGrid').innerHTML=out;
 renderSelected();
}
function selectDate(s){let [y,m,d]=s.split('-').map(Number);selected=new Date(y,m-1,d);renderCalendar()}
function shiftWeek(n){weekOffset+=n;let b=monday(today);b.setDate(b.getDate()+weekOffset*7);selected=new Date(b);renderCalendar()}
function goToday(){selected=new Date(today);weekOffset=0;renderCalendar()}
function renderSelected(){let p=plan[selected.getDay()], total=p.ex.reduce((a,e)=>a+setsFor(e[1],selected),0), held=localStorage.runHold!=='false';
 document.getElementById('screenTitle').textContent=iso(selected)===iso(today)?'Today':fmt(selected);
 document.getElementById('phase').textContent=(selected<HYROX?'PRE-HYROX':'HYROX')+' · WEEK '+weekOf(selected);
 document.getElementById('selectedCard').innerHTML=`<div class="card"><div class="eyebrow">${fmt(selected).toUpperCase()}</div><h2>${p.name}</h2><div class="sub">${p.sub}</div><div class="summary"><div class="metric"><b>${total||'—'}</b><span>working sets</span></div><div class="metric"><b>${p.run?'RUN':'—'}</b><span>${p.run||'no run'}</span></div><div class="metric"><b>${rir(selected)}</b><span>target RIR</span></div></div>${p.run&&held?'<div class="card notice"><b>Run hold is active</b><div class="small">The run stays visible for planning, but is not a prompt to resume.</div></div>':''}<button class="btn full" style="margin-top:14px" onclick="openWorkout('${iso(selected)}')">${iso(selected)>iso(today)?'VIEW / LOG WORKOUT':'OPEN WORKOUT'}</button></div>`;
}
function renderProgram(){let names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], days=[1,2,3,4,5,6,0], out='';days.forEach((dow,i)=>{let p=plan[dow];out+=`<div class="exercise"><div class="eyebrow">${names[i]}</div><h3>${p.name}</h3><div class="small">${p.run||p.sub}</div></div>`});document.getElementById('programList').innerHTML=out}

const subs={
'Barbell Bench Press':['DB Bench Press','Machine Chest Press','Push-Up'],
'Incline DB Press':['Incline Machine Press','Incline Push-Up','Floor Press'],
'Seated DB Shoulder Press':['Machine Shoulder Press','Standing DB Press','Landmine Press'],
'Cable / Machine Fly':['DB Fly','Push-Up','Band Fly'],
'Pull-up / Lat Pulldown':['Band Pulldown','DB Pullover','Inverted Row'],
'Chest-Supported Row':['Seated Cable Row','1-Arm DB Row','Machine Row'],
'Single-Arm Cable Row':['1-Arm DB Row','Band Row','Machine Row'],
'Back Squat':['Goblet Squat','DB Front Squat','Leg Press'],
'Romanian Deadlift':['DB RDL','KB RDL','Hip Thrust'],
'Bulgarian Split Squat':['Reverse Lunge','Walking Lunge','Step-Up'],
'Leg Curl':['Slider Leg Curl','Stability-Ball Curl','DB Leg Curl'],
'Leg Extension':['Spanish Squat','Sissy Squat','Goblet Cyclist Squat'],
'Standing Calf Raise':['Single-Leg Calf Raise','DB Calf Raise'],
'Incline Bench Press':['Incline DB Press','Machine Chest Press','Push-Up'],
'Flat DB Press':['Push-Up','Machine Chest Press','Floor Press'],
'Seated Cable Row':['1-Arm DB Row','Band Row','Chest-Supported DB Row'],
'EZ-Bar Curl':['DB Curl','Band Curl','Cable Curl'],
'Cable Curl':['DB Curl','Band Curl','Hammer Curl'],
'Triceps Pressdown':['DB Skullcrusher','Band Pressdown','Close-Grip Push-Up'],
'Rope Pressdown':['DB Skullcrusher','Band Pressdown','Close-Grip Push-Up'],
'Lateral Raise':['DB Lateral Raise','Band Lateral Raise'],
'Cable Lateral Raise':['DB Lateral Raise','Band Lateral Raise'],
'Rear-Delt Fly':['DB Rear-Delt Fly','Band Pull-Apart']
};
let timerInt=null,timerLeft=0,subTarget=null;
function suggested(ex,date){
 let h=history().filter(x=>x.date<iso(date)).sort((a,b)=>b.date.localeCompare(a.date));
 for(let w of h){let f=(w.sets||[]).filter(s=>s.exercise===ex&&s.weight&&s.reps);if(f.length){
   let last=f[f.length-1], rr=repRange(date).split('–').map(Number), good=f.every(s=>s.reps>=rr[1] && (s.rir===null||s.rir>=1));
   let inc=last.weight>=100?5:2.5; return good?`Suggested: ${(last.weight+inc).toFixed(last.weight+inc===Math.round(last.weight+inc)?0:1)} lb · earned small increase`:`Suggested: ${last.weight} lb · repeat and own the range`;
 }} return 'Suggested: choose a load that leaves '+rir(date)+' RIR';
}
function startTimer(sec=90){stopTimer(false);timerLeft=sec;document.getElementById('restTimer').classList.remove('hidden');tickTimer();timerInt=setInterval(()=>{timerLeft--;tickTimer();if(timerLeft<=0)stopTimer()},1000)}
function tickTimer(){let m=Math.floor(timerLeft/60),s=timerLeft%60;document.getElementById('timerValue').textContent=m+':'+String(s).padStart(2,'0')}
function addTimer(n){timerLeft+=n;tickTimer()}
function stopTimer(hide=true){if(timerInt)clearInterval(timerInt);timerInt=null;if(hide)document.getElementById('restTimer').classList.add('hidden')}
function toggleSet(btn){btn.classList.toggle('done');btn.textContent=btn.classList.contains('done')?'✓':'';if(btn.classList.contains('done'))startTimer(90);updateWorkoutProgress()}
function updateWorkoutProgress(){let all=[...document.querySelectorAll('.check')],done=all.filter(x=>x.classList.contains('done')).length;let el=document.getElementById('workoutProgress');if(el){el.textContent=done+' / '+all.length+' sets complete';document.getElementById('workoutProgressBar').style.width=(all.length?done/all.length*100:0)+'%'}}
function openSubs(ex){subTarget=ex;document.getElementById('subTitle').textContent='Replace '+ex;let choices=subs[ex]||['DB variation','Machine variation','Bodyweight variation'];document.getElementById('subChoices').innerHTML=choices.map(x=>`<button class="choice" onclick="chooseSub('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('');document.getElementById('subModal').classList.remove('hidden')}
function closeSubs(){document.getElementById('subModal').classList.add('hidden')}
function chooseSub(name){let card=[...document.querySelectorAll('#exerciseList .exercise[data-ex]')].find(x=>x.dataset.ex===subTarget);if(card){card.dataset.ex=name;card.querySelector('h3').textContent=name;let s=card.querySelector('.suggest');if(s)s.textContent=suggested(name,activeDate)}closeSubs()}

function openWorkout(s){let [y,m,d]=s.split('-').map(Number);activeDate=new Date(y,m-1,d);let p=plan[activeDate.getDay()];document.getElementById('today').classList.add('hidden');document.getElementById('program').classList.add('hidden');document.getElementById('progress').classList.add('hidden');document.getElementById('history').classList.add('hidden');document.getElementById('workout').classList.remove('hidden');document.getElementById('tabs').classList.add('hidden');document.getElementById('workoutDate').textContent=fmt(activeDate).toUpperCase();document.getElementById('workoutName').textContent=p.name;stopTimer();
 let old=history().find(x=>x.date===iso(activeDate)), oldSets=old?.sets||[], out='<div class="complete" id="workoutProgress">0 sets complete</div><div class="progressline"><i id="workoutProgressBar"></i></div>';
 p.ex.forEach((e,ei)=>{let n=setsFor(e[1],activeDate), prev=previous(e[0],activeDate);out+=`<div class="exercise" data-ex="${e[0]}"><div class="exhead"><div><h3>${e[0]}</h3><div class="small">${n} × ${repRange(activeDate)} · ${rir(activeDate)} RIR · Previous: ${prev}</div><div class="suggest">${suggested(e[0],activeDate)}</div></div><button class="mini" onclick="openSubs('${e[0].replace(/'/g,"\\'")}')">SWAP</button></div>`;
   for(let i=1;i<=n;i++){let os=oldSets.filter(x=>x.exercise===e[0])[i-1]||{};out+=`<div class="setrow"><b>${i}</b><input data-w inputmode="decimal" placeholder="lb" value="${os.weight||''}"><input data-r inputmode="numeric" placeholder="reps" value="${os.reps||''}"><input data-rir inputmode="numeric" placeholder="RIR" value="${os.rir??''}"><button class="check ${os.done?'done':''}" onclick="toggleSet(this)">${os.done?'✓':''}</button></div>`}out+='</div>'});
 if(p.run){let hold=localStorage.runHold!=='false',r=old?.run||{};out+=`<div class="exercise"><h3>Run</h3><div class="small">${hold?'RUN HOLD ACTIVE · ':''}${p.run}</div><div class="runfields"><input id="runDist" inputmode="decimal" placeholder="Distance (mi)" value="${r.distance||''}"><input id="runTime" placeholder="Time" value="${r.time||''}"><input id="runHr" inputmode="numeric" placeholder="Avg HR" value="${r.hr||''}"><input id="runRpe" inputmode="numeric" placeholder="RPE" value="${r.rpe||''}"><textarea id="runNotes" placeholder="Run notes">${r.notes||''}</textarea></div></div>`}
 document.getElementById('exerciseList').innerHTML=out;updateWorkoutProgress();
}
function closeWorkout(){stopTimer();document.getElementById('workout').classList.add('hidden');document.getElementById('today').classList.remove('hidden');document.getElementById('tabs').classList.remove('hidden')}
function saveWorkout(){let p=plan[activeDate.getDay()],sets=[];document.querySelectorAll('#exerciseList .exercise[data-ex]').forEach(ex=>{let name=ex.dataset.ex;ex.querySelectorAll('.setrow').forEach(r=>{sets.push({exercise:name,weight:+r.querySelector('[data-w]').value||0,reps:+r.querySelector('[data-r]').value||0,rir:+r.querySelector('[data-rir]').value||null,done:r.querySelector('.check').classList.contains('done')})})});let run=p.run?{distance:+(document.getElementById('runDist')?.value||0),time:document.getElementById('runTime')?.value||'',hr:+(document.getElementById('runHr')?.value||0),rpe:+(document.getElementById('runRpe')?.value||0),notes:document.getElementById('runNotes')?.value||''}:null;let h=history(),entry={date:iso(activeDate),label:fmt(activeDate),name:p.name,sets,run,volume:sets.reduce((a,s)=>a+s.weight*s.reps,0)};let ix=h.findIndex(x=>x.date===entry.date);if(ix>=0)h[ix]=entry;else h.unshift(entry);localStorage.forgeHistory=JSON.stringify(h);renderHistory();renderProgress();closeWorkout();alert('Workout saved.')}
function renderHistory(){let h=history(),el=document.getElementById('historyList');el.innerHTML=h.length?h.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="history"><div class="row"><div><b>${x.name}</b><div class="small">${x.label||x.date}</div></div><div style="text-align:right"><b>${Math.round(x.volume||0).toLocaleString()} lb</b><div class="small">${x.run&&x.run.distance?x.run.distance+' mi':''}</div></div></div><button class="btn secondary full" style="margin-top:8px" onclick="openWorkout('${x.date}')">OPEN / EDIT</button></div>`).join(''):'<div class="sub">No workouts logged yet.</div>'}
function renderProgress(){let h=history(),vol=h.reduce((a,x)=>a+(x.volume||0),0),mi=h.reduce((a,x)=>a+(x.run?.distance||0),0);document.getElementById('volume').textContent=Math.round(vol).toLocaleString()+' lb';document.getElementById('sessions').textContent=h.length+' logged session'+(h.length===1?'':'s');document.getElementById('mileage').textContent=mi.toFixed(1)+' mi'}
function showTab(id,b){['today','program','progress','history','workout'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='history')renderHistory();if(id==='progress')renderProgress()}
function init(){renderCalendar();renderProgram();renderHistory();renderProgress()} init();
</script>
</body></html>
